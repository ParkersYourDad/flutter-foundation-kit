name: Bootstrap Flutter project

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/bootstrap-flutter-project.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bootstrap-flutter-project
  cancel-in-progress: false

jobs:
  generate-verify-and-commit:
    name: Generate, verify, and commit Flutter project
    runs-on: macos-26
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Select Xcode 26.6
        shell: bash
        run: |
          set -euo pipefail
          sudo xcode-select --switch /Applications/Xcode_26.6.app/Contents/Developer
          xcodebuild -version

      - name: Set up Java 17
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@0ca7a949e71ae44c8e688a51c5e7e93b2c87e295
        with:
          flutter-version: "3.47.9"
          channel: stable
          cache: true

      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail
          set +e
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358"
          sdkmanager_status=${PIPESTATUS[1]}
          set -e
          exit "$sdkmanager_status"

      - name: Generate official Android and iOS scaffold
        shell: bash
        run: |
          set -euo pipefail
          flutter create --empty --platforms=android,ios --org com.foundationkit --project-name foundation_kit "$RUNNER_TEMP/foundation_kit"
          python3 - <<'PY'
          from pathlib import Path
          import re

          project = Path.home().parent / "runner" / "foundation_kit" / "ios" / "Runner.xcodeproj" / "project.pbxproj"
          if not project.exists():
              project = Path(__import__("os").environ["RUNNER_TEMP"]) / "foundation_kit" / "ios" / "Runner.xcodeproj" / "project.pbxproj"
          source = project.read_text()
          updated, count = re.subn(
              r"(IPHONEOS_DEPLOYMENT_TARGET\s*=\s*)[0-9]+(?:\.[0-9]+)?;",
              r"\g<1>15.0;",
              source,
          )
          if count == 0:
              raise SystemExit("Could not locate iOS deployment target in generated Xcode project.")
          project.write_text(updated)
          print(f"Set iOS deployment target to 15.0 in {count} build setting(s).")
          PY

      - name: Resolve dependencies and verify Dart code
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/foundation_kit"
          flutter pub get
          flutter analyze --fatal-infos
          flutter test

      - name: Build Android debug APK
        shell: bash
        run: |
          cd "$RUNNER_TEMP/foundation_kit"
          flutter build apk --debug

      - name: Build iOS debug app without signing
        shell: bash
        run: |
          cd "$RUNNER_TEMP/foundation_kit"
          flutter build ios --no-codesign --debug

      - name: Add generated Flutter project to repository
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          for path in android ios lib test pubspec.yaml pubspec.lock analysis_options.yaml .metadata; do
            if [ -e "$RUNNER_TEMP/foundation_kit/$path" ]; then
              rm -rf "$path"
              cp -R "$RUNNER_TEMP/foundation_kit/$path" "$path"
            fi
          done
          git add android ios lib test pubspec.yaml pubspec.lock analysis_options.yaml .metadata
          if git diff --cached --quiet; then
            echo "No generated project changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat: add verified Flutter Android and iOS project scaffold"
          git push origin HEAD:main
